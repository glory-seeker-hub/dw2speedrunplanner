<!doctype html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Phase 2N-B target verification</title></head>
<body><div id="root"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {OptimizedSearchResults} from '/src/components/OptimizedSearchResults.tsx';
import {createOptimizedSearch} from '/src/utils/battle/battleOptimizedSearch.ts';
import {createBattleState} from '/src/utils/battle/battleInput.ts';
import '/src/index.css';
const fixtures=await (await fetch('./browser-fixtures.json')).json();
function Fixture(){
  const [results,setResults]=React.useState([]),[busy,setBusy]=React.useState(false);
  async function run(){
    setBusy(true);setResults([]);
    for(const fixture of fixtures){
      const search=createOptimizedSearch(fixture.input,128,{seed:42,maxRounds:8,config:{beamWidth:2,maxDepth:3},simulationRules:{accuracyMode:'strategy'}});
      while(!search.done){search.step();await new Promise(resolve=>setTimeout(resolve,0));}
      const result=search.result('completed',1).optimized;
      const combatants=createBattleState(fixture.input).combatants.map(a=>({...a,slot:a.position+1}));
      setResults(previous=>[...previous,{name:fixture.name,result,combatants}]);
    }
    setBusy(false);
  }
  return React.createElement('main',{className:'p-4 mx-auto max-w-6xl space-y-8'},
    React.createElement('h1',{className:'text-2xl font-bold'},'Phase 2N-B: production search and result components'),
    React.createElement('button',{onClick:run,disabled:busy,className:'rounded border p-3'},busy?'Running searches…':'Run targeting scenarios'),
    React.createElement('p',{role:'status'},`${results.length} / ${fixtures.length} searches complete`),
    results.map(row=>React.createElement('section',{key:row.name,'aria-label':row.name,className:'border-t pt-6 space-y-4'},
      React.createElement('h2',{className:'text-xl font-bold'},row.name),
      React.createElement(OptimizedSearchResults,{result:row.result,combatants:row.combatants}),
      row.name.startsWith('Assist')&&React.createElement('details',null,
        React.createElement('summary',null,'Compare screened Assist strategy'),
        React.createElement(OptimizedSearchResults,{result:{...row.result,objective:'average-victory'},combatants:row.combatants})))));
}
createRoot(document.getElementById('root')).render(React.createElement(Fixture));
</script></body></html>
